spring.application.name=momento-cafe

# Porta do servidor
server.port=8080

# Banco H2
spring.datasource.url=jdbc:h2:file:./data/momentocafe
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Console do H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Permitir acesso ao banco pelo console
spring.h2.console.settings.web-allow-others=truespring.application.name=cafeteriamomentocafe
